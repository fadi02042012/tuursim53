name: Correct US city classifications

on:
  push:
    paths:
      - "output/by_country/US.json"
      - "scripts/correct-us-city-classification.js"
      - ".github/workflows/correct-us-cities.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Natural Earth country boundaries
        run: |
          curl -L --fail --retry 3 -o /tmp/ne_110m_admin_0_countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson

      - name: Correct foreign cities in US.json
        run: node scripts/correct-us-city-classification.js

      - name: Commit corrections
        run: |
          if git diff --quiet; then
            echo "No classification corrections were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/by_country
          git commit -m "Correct cities classified as United States"
          git push
