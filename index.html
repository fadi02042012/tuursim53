ons button{width:40px;height:40px;border:1px solid #e8e7f2;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(79,70,120,.12);cursor:pointer}.skip-link{position:absolute;right:8px;top:8px;z-index:2000}@media(max-width:820px){.google-top-inner{padding:8px 10px}.google-logo img{width:38px!important;height:38px!important}.google-actions{display:none}.google-country-select{max-width:100px}.container{padding:18px 0 70px}.msn-header{padding:16px}.header-right{display:none}.msn-page-intro{flex-direction:column;align-items:stretch}.msn-hero-side{justify-content:space-between}.msn-header,.msn-nav,.msn-page-intro,.msn-shortcuts,.msn-section-nav,.stats-bar,.tools,.counter,#status{margin-left:12px;margin-right:12px}#results{width:calc(100% - 24px)!important}}@media(max-width:520px){.google-country-select,.google-divider{display:none}.google-search-btn{padding:9px 14px}.google-search-advanced-btn{padding:9px 11px;font-size:13px}.google-search-btn .btn-text{display:none}.google-search-bar{min-height:50px}.google-search-icon{flex-basis:38px;width:38px;height:38px}.google-search-bar input{font-size:.94rem}.msn-nav{overflow-x:auto;flex-wrap:nowrap}.msn-header{justify-content:center;text-align:center}.header-left{justify-content:center}.featured-instagram{width:calc(100% - 24px);padding:8px}}

<div class="floating-buttons"><button onclick="window.scrollTo({top:0,behavior:'smooth'})" title="العودة للأعلى">⬆️</button><button id="nextResultsSideBtn" type="button" title="عرض 10 نتائج أخرى" aria-label="عرض 10 نتائج أخرى">⬇️</button><button onclick="toggleTheme()" title="تبديل المظهر">🌓</button><button onclick="showStatistics()" title="الإحصائيات">📊</button><button onclick="showFavorites()" title="المفضلة">⭐</button></div>

<nav class="msn-nav" aria-label="التنقل الرئيسي"><a class="is-active" href="./">🏠 اكتشاف</a><a href="#search">🔍 البحث الذكي</a><a href="#results">🏙️ المدن</a><a href="#results">🌍 الدول</a><button type="button" onclick="showFavorites()">⭐ المفضلة</button><button type="button" onclick="showStatistics()">📊 الإحصائيات</button></nav>
<div class="stats-bar"><div class="stats-item">📌 <span class="number" id="totalCities">0</span> مدينة</div><div class="stats-item">🌍 <span class="number" id="totalCountries">0</span> دولة</div><div class="stats-item">🔗 <span class="number" id="totalLinks">0</span> رابط</div><div class="stats-item">📊 <span class="number" id="totalResults">0</span> نتيجة</div></div>

<script>(function(){const btn=document.getElementById('nextResultsSideBtn');if(btn)btn.addEventListener('click',()=>{if(typeof window.loadNextResultsPage==='function')window.loadNextResultsPage();});})();</script>
<script>
(function(){
  const promo=document.getElementById('featuredInstagram');
  const results=document.getElementById('results');
  const search=document.getElementById('search');
  if(!promo||!results) return;
  function syncPromo(){
    const hasResults=results.children.length>0;
    const hasQuery=String(search?.value||'').trim().length>0;
    promo.hidden=hasResults||hasQuery;
  }
  new MutationObserver(syncPromo).observe(results,{childList:true});
  search?.addEventListener('input',syncPromo);
  syncPromo();
})();
</script>
<script>
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=8').catch(console.warn));
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(() => {});
}
</script>
<script>
(function(){
  const key='tuursim53_theme';
  function applyTheme(mode){
    const dark=mode==='dark';
    document.body.classList.toggle('dark-mode',dark);
    document.documentElement.style.colorScheme=dark?'dark':'light';
    document.querySelectorAll('[onclick="toggleTheme()"] , [title="تبديل المظهر"]').forEach(btn=>{
      btn.textContent=dark?'☀️':'🌓';
      btn.setAttribute('aria-label',dark?'الوضع النهاري':'تبديل المظهر');
      btn.setAttribute('title',dark?'الوضع النهاري':'تبديل المظهر');
    });
  }
  window.toggleTheme=function(){
    const next=document.body.classList.contains('dark-mode')?'light':'dark';
    try{localStorage.setItem(key,next);}catch(_){ }
    applyTheme(next);
  };
  let saved='light';
  try{saved=localStorage.getItem(key)||'light';}catch(_){ }
  applyTheme(saved);
})();
</script>
