    <!-- ============================================================
         CSS إضافي
         ============================================================ -->
    <style>
        /* تحسين عرض الأيقونة في المتصفحات المختلفة */
        link[rel="icon"] {
            border-radius: 50%;
        }
        
        /* دعم المتصفحات القديمة */
        link[rel="shortcut icon"] {
            border-radius: 50%;
        }
        
        /* إضافة تأثير بسيط للأيقونة (في بعض المتصفحات) */
        @keyframes faviconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* تطبيق التأثير على الأيقونة */
        link[rel="icon"] {
            animation: faviconPulse 3s ease-in-out infinite;
        }
    </style>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================================
         الأزرار الجانبية
         ============================================================ -->
    <div class="floating-buttons">
        <button class="btn-scroll" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="العودة للأعلى">⬆️</button>
        <button class="btn-theme" onclick="toggleTheme()" title="تبديل المظهر">🌓</button>
        <button class="btn-stats" onclick="showStatistics()" title="الإحصائيات">📊</button>
        <button class="btn-fav" onclick="showFavorites()" title="المفضلة">⭐</button>
    </div>

    <!-- ============================================================
         الحاوية الرئيسية
         ============================================================ -->
    <div class="container">
        
        <!-- ============================================================
             الهيدر مع الأيقونة
             ============================================================ -->
        <header>
            <div class="header-left">
                <!-- الأيقونة -->
                <a href="/" class="logo-container">
                    <img 
                        src="https://pbs.twimg.com/profile_images/598937920041422848/hD7-XB9f_400x400.jpg" 
                        alt="شعار الموقع" 
                        class="logo-image"
                        loading="lazy"
                    />
                    <div class="header-title">
                        <h1>🔍 البحث <span>الذكي</span></h1>
                        <span class="subtitle">📺 YouTube - بحث متقدم مع 100 نتيجة</span>
                    </div>
                </a>
            </div>
            <div class="header-right">
                <span class="header-badge">🚀 100 نتيجة</span>
                <span class="header-badge" style="background:#10b981;">📊 51 رابط</span>
            </div>
        </header>

        <!-- ============================================================
             شريط الإحصائيات
             ============================================================ -->
        <div class="stats-bar">
            <div class="stats-item">
                📌 <span class="number" id="totalCities">0</span> مدينة
            </div>
            <div class="stats-item">
                🌍 <span class="number" id="totalCountries">0</span> دولة
            </div>
            <div class="stats-item">
                🔗 <span class="number" id="totalLinks">0</span> رابط
            </div>
            <div class="stats-item">
                📊 <span class="number" id="totalResults">0</span> نتيجة
            </div>
        </div>

        <!-- ============================================================
             قسم البحث
             ============================================================ -->
        <div class="search-section">
            <div class="search-row">
                <select id="country">
                    <option value="">🌐 كل الدول</option>
                </select>
                <div class="search-wrapper">
                    <input id="search" type="text" placeholder="🔍 ابحث عن مدينة، دولة، أو أي كلمة..." autocomplete="off">
                    <div id="suggestions"></div>
                </div>
                <button id="searchBtn" class="btn-primary">🔍 بحث</button>
            </div>
            <div id="status">⏳ جاري تحميل البيانات من JSON...</div>
        </div>

        <!-- ============================================================
             أدوات التحكم
             ============================================================ -->
        <div class="tools">
            <button class="btn-copy" id="copyAll">📋 نسخ جميع الروابط</button>
            <button class="btn-open" id="openAll">🚀 فتح الجميع</button>
            <button class="btn-clear" id="clearResults">🗑 مسح النتائج</button>
            <button class="btn-filter" id="filterLinks">🔍 تصفية</button>
            <button class="btn-export" id="exportCSV">📊 تصدير CSV</button>
            <button class="btn-print" id="printResults">🖨️ طباعة</button>
        </div>

        <!-- ============================================================
             العداد
             ============================================================ -->
        <div class="counter">
            عدد النتائج: <span id="count">0</span>
        </div>

        <!-- ============================================================
             النتائج
             ============================================================ -->
        <div id="results">
            <div class="loading">
                <div class="spinner">⏳</div>
                <p>جاري تحميل البيانات من ملفات JSON...</p>
                <p style="font-size:14px;color:#94a3b8;">📁 cities.json و countries.json</p>
                <p style="font-size:14px;color:#94a3b8;">📂 output/by_country/*.json</p>
            </div>
        </div>
    </div>

    <!-- ============================================================
         الجافاسكريبت - ملفات مقسمة
         ============================================================ -->
    <script src="js/00-config.js"></script>
    <script src="js/01-data.js"></script>
    <script src="js/02-search.js"></script>
    <script src="js/03-links.js"></script>
    <script src="js/04-ui.js"></script>
    <script src="js/05-events.js"></script>
    <script src="js/06-security.js"></script>
    <script src="js/app.js"></script>
</body>
